services:
  docs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_URL: ${SITE_URL:-http://localhost:8080/}
    image: noteharbor-docs:latest
    container_name: noteharbor-docs
    ports:
      - "${PORT:-8080}:80"
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
